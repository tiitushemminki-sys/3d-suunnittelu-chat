<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>Ylläpito – 3D-suunnittelupyynnöt</title>
<style>
:root{color-scheme:dark;--bg:#09111e;--panel:#121e30;--line:#2b3b52;--blue:#2676e8;--text:#f4f7fb;--muted:#aab7c9;--green:#35b879}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#080d16,#14233a);color:var(--text);font:15px/1.5 Arial,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0;font-size:clamp(23px,4vw,34px)}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.login{max-width:440px;margin:9vh auto}.field{display:grid;gap:6px;margin:12px 0}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid var(--line);background:#0b1627;color:var(--text);width:100%}button{background:var(--blue);border:0;font-weight:700;cursor:pointer}button.secondary{background:#26364d}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.hidden{display:none!important}.grid{display:grid;grid-template-columns: minmax(230px, .8fr) minmax(0,1.6fr);gap:16px}.requests{display:grid;gap:8px;max-height:68vh;overflow:auto}.request{padding:12px;text-align:left;background:#0c192b;border:1px solid var(--line)}.request.active{border-color:var(--blue);background:#142a48}.request strong,.request small{display:block}.request small{color:var(--muted);margin-top:4px}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#26364d;font-size:12px}.detail h2{margin-top:0}.detail dl{display:grid;grid-template-columns:130px 1fr;gap:7px;margin:16px 0}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.notice{padding:12px;border-radius:10px;background:#302a18;color:#f5d98b;margin:12px 0}.error{color:#ff9c9c}.success{color:#78e0ae}.empty{color:var(--muted);padding:24px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.requests{max-height:32vh}.top{align-items:flex-start}.detail dl{grid-template-columns:110px 1fr}}
</style></head><body><main class="wrap">
<section id="login" class="panel login"><h1>Ylläpito</h1><p class="muted">Kirjaudu Appwrite-ylläpitotililläsi.</p><form id="loginForm"><label class="field">Sähköposti<input id="email" type="email" autocomplete="username" required></label><label class="field">Salasana<input id="password" type="password" autocomplete="current-password" required></label><button id="loginBtn">Kirjaudu sisään</button></form><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><header class="top"><div><h1>Suunnittelupyyntöjen hallinta</h1><div class="muted" id="who"></div></div><button class="secondary" id="logout" style="max-width:140px">Kirjaudu ulos</button></header>
<div class="notice">Jos pyyntöjä ei näy, Appwrite-taulun käyttöoikeudet pitää antaa tälle ylläpitäjäkäyttäjälle. Älä koskaan lisää API-avainta tähän sovellukseen.</div>
<div class="grid"><aside class="panel"><div class="row"><h2 style="margin:0">Pyynnöt</h2><button id="refresh" style="max-width:100px">Päivitä</button></div><p class="muted" id="count">Ladataan…</p><div id="requests" class="requests"></div></aside>
<section class="panel detail" id="detail"><div class="empty">Valitse pyyntö listasta.</div></section></div></section>
</main>
<script type="module">
import {Client,Account,TablesDB,Storage,Query} from 'https://cdn.jsdelivr.net/npm/appwrite@21.3.0/+esm';
const ENDPOINT='https://fra.cloud.appwrite.io/v1', PROJECT='6af963e00016fcf59916', DATABASE='6af963e0003a79ee5814', TABLE='6af965ae00286fabfddd', BUCKET='6af9762600381608ee69';
const client=new Client().setEndpoint(ENDPOINT).setProject(PROJECT), account=new Account(client), tables=new TablesDB(client), storage=new Storage(client);
const $=id=>document.getElementById(id);let rows=[],selected=null;
function msg(el,s,cls=''){el.textContent=s;el.className=cls}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function showApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email;await loadRows()}
async function loadRows(){ $('count').textContent='Ladataan…';$('requests').innerHTML='';try{const r=await tables.listRows({databaseId:DATABASE,tableId:TABLE,queries:[Query.orderDesc('$createdAt'),Query.limit(100)]});rows=r.rows||[];$('count').textContent=rows.length+' pyyntöä';if(!rows.length)$('requests').innerHTML='<div class="empty">Ei pyyntöjä tai käyttäjällä ei ole lukuoikeutta.</div>';rows.forEach(row=>{const b=document.createElement('button');b.className='request'+(selected?.$id===row.$id?' active':'');b.innerHTML='<strong>'+esc(row.asiakas_nimi||'Nimetön')+'</strong><small>'+esc(row.asiakas_email||'')+'</small><small>'+esc(row.$createdAt||'')+'</small><span class="pill">'+esc(row.tilauksen_tila||'uusi')+'</span>';b.onclick=()=>renderDetail(row);$('requests').append(b)})}catch(e){$('count').textContent='Pyyntöjen lataus epäonnistui';$('requests').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
function renderDetail(r){selected=r;document.querySelectorAll('.request').forEach((b,i)=>b.classList.toggle('active',rows[i]?.$id===r.$id));$('detail').innerHTML='<h2>'+esc(r.asiakas_nimi||'Asiakaspyyntö')+'</h2><div class="muted">'+esc(r.asiakas_email||'')+'</div><dl><dt>Kuvaus (alkuperäinen)</dt><dd>'+esc(r.alkuperainen_kuvaus||r.esineen_kuvaus)+'</dd><dt>Kuvaus (suomeksi)</dt><dd>'+esc(r.esineen_kuvaus)+'</dd><dt>Mitat</dt><dd>'+esc(r.pituus_mm)+' × '+esc(r.leveys_mm)+' × '+esc(r.korkeus_mm)+' mm</dd><dt>Materiaali</dt><dd>'+esc(r.materiaali||'PLA')+'</dd><dt>Luotu</dt><dd>'+esc(r.$createdAt)+'</dd><dt>STL</dt><dd>'+fileLink(r.stl_tiedosto)+'</dd><dt>3MF</dt><dd>'+fileLink(r['3mf_tiedosto'])+'</dd></dl><label class="field">Pyynnön tila<select id="status"><option value="uusi">Uusi</option><option value="kasittelyssa">Käsittelyssä</option><option value="hyvaksytty">Hyväksytty</option><option value="hylatty">Hylätty</option><option value="muutospyynto">Muutospyyntö</option></select></label><button id="saveStatus">Tallenna tila</button><p id="saveMsg" class="muted"></p>';$('status').value=r.tilauksen_tila||'uusi';$('saveStatus').onclick=async()=>{const btn=$('saveStatus');btn.disabled=true;msg($('saveMsg'),'Tallennetaan…');try{await tables.updateRow({databaseId:DATABASE,tableId:TABLE,rowId:r.$id,data:{tilauksen_tila:$('status').value}});r.tilauksen_tila=$('status').value;msg($('saveMsg'),'Tila tallennettu.','success');await loadRows();renderDetail(r)}catch(e){msg($('saveMsg'),e.message,'error')}finally{btn.disabled=false}}}
function fileLink(id){if(!id)return '<span class="muted">Ei vielä saatavilla</span>';return '<button class="secondary" data-file="'+esc(id)+'">Lataa tiedosto</button>'}
$('detail').addEventListener('click',async e=>{const b=e.target.closest('[data-file]');if(!b)return;try{const url=storage.getFileDownload({bucketId:BUCKET,fileId:b.dataset.file});window.open(url,'_blank','noopener')}catch(err){alert(err.message)}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;msg($('loginMsg'),'Kirjaudutaan…');try{await account.createEmailPasswordSession({email:$('email').value,password:$('password').value});const user=await account.get();await showApp(user)}catch(err){msg($('loginMsg'),err.message,'error')}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await account.deleteSession({sessionId:'current'});$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
$('refresh').onclick=loadRows;
try{const user=await account.get();await showApp(user)}catch{}
</script></body></html>
