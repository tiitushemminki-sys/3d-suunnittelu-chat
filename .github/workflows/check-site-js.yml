name: Check website JavaScript and CAD engine
on:
  push:
    paths:
      - "index.html"
      - ".github/workflows/check-site-js.yml"
      - "tests/**"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline scripts and check syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Install OpenSCAD WebAssembly
        run: npm install --no-save @lofcz/openscad-wasm@0.0.2 playwright
      - name: Compile a parametric test model to STL and 3MF
        run: |
          node --input-type=module <<'JS'
          import OpenSCAD from "@lofcz/openscad-wasm";
          import { addFonts } from "@lofcz/openscad-wasm/fonts";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";

          const wasmBytes = readFileSync(join(process.cwd(), "node_modules/@lofcz/openscad-wasm/openscad.wasm"));
          const scad = `
          $fn = 48;
          difference() {
            hull() {
              for (x = [-15, 15])
                for (y = [-10, 10])
                  translate([x, y, 0]) cylinder(r = 4, h = 8, center = true);
            }
            translate([0, 0, -8]) cylinder(d = 6, h = 16);
          }
          `;

          async function compile(format) {
            const instance = await OpenSCAD({
              noInitialRun: true,
              instantiateWasm(imports, receiveInstance) {
                WebAssembly.instantiate(wasmBytes, imports).then(({ instance }) => receiveInstance(instance));
                return {};
              }
            });
            addFonts(instance);
            instance.FS.writeFile("/test.scad", scad);
            const output = format === "stl" ? "/test.stl" : "/test.3mf";
            const args = format === "stl"
              ? ["/test.scad", "--backend", "Manifold", "--export-format", "binstl", "-o", output]
              : ["/test.scad", "--backend", "Manifold", "--export-format", "3mf", "-o", output];
            const exitCode = instance.callMain(args);
            if (exitCode !== 0) throw new Error("OpenSCAD failed to export " + format);
            const bytes = instance.FS.readFile(output);
            if (!(bytes instanceof Uint8Array) || bytes.length < 100) throw new Error("Empty " + format + " output");
            if (format === "stl") {
              const count = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(80, true);
              if (bytes.length !== 84 + count * 50 || count === 0) throw new Error("Invalid binary STL");
            } else if (bytes[0] !== 0x50 || bytes[1] !== 0x4b) {
              throw new Error("Invalid 3MF ZIP signature");
            }
            console.log(format.toUpperCase() + " export passed (" + bytes.length + " bytes)");
          }

          await compile("stl");
          await compile("3mf");
          JS
      - name: Test the live AI response format
        env:
          AI_ENDPOINT: https://3d-mallinnus-palvelu-6af9.fra.appwrite.run
        run: |
          node --input-type=module <<'JS'
          const prompt = `You are a mechanical CAD designer. Reply in Finnish. For every reply output exactly one <MODEL_SPEC> JSON block followed by one <SCAD_CODE> block. MODEL_SPEC JSON: {"name":"name","description":"description","material":"PLA","dimensions":{"x":40,"y":40,"z":40}}. SCAD_CODE is complete valid OpenSCAD code only. No Markdown fences, no external dependencies. Make an accurate 40 mm cube. Return these blocks now.`;
          const response = await fetch(process.env.AI_ENDPOINT, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              action: "chat",
              messages: [
                {role:"user",content:prompt},
                {role:"user",content:"Tee 40 mm kuutio."}
              ]
            }),
            signal: AbortSignal.timeout(120000)
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error("AI endpoint failed: " + JSON.stringify(data).slice(0,1500));
          const reply = String(data.reply || "");
          function extract(tag) {
            const start = reply.indexOf("<" + tag + ">");
            if (start < 0) return "";
            const contentStart = start + tag.length + 2;
            const end = reply.indexOf("</" + tag + ">", contentStart);
            return end < 0 ? "" : reply.slice(contentStart, end).trim();
          }
          const specText = extract("MODEL_SPEC");
          const scad = extract("SCAD_CODE");
          if (!specText) throw new Error("AI did not return MODEL_SPEC: " + reply.slice(-2000));
          if (!scad) throw new Error("AI did not return SCAD_CODE: " + reply.slice(-3000));
          const spec = JSON.parse(specText);
          const hasGeometry = ["cube(", "cube (", "cylinder(", "cylinder (", "sphere(", "sphere (", "polygon(", "linear_extrude("].some(x => scad.includes(x));
          if (!spec || !spec.dimensions || !hasGeometry) throw new Error("AI response does not contain usable CAD geometry: " + reply.slice(-3000));
          console.log("Live AI response contains valid model metadata and OpenSCAD code.");
          console.log("Model: " + spec.name + "; dimensions: " + JSON.stringify(spec.dimensions) + "; SCAD characters: " + scad.length);
          JS
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Test real AI chat and browser downloads
        run: node tests/browser-download.mjs
